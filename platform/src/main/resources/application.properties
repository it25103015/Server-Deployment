spring.config.import=optional:classpath:application-local.properties

spring.application.name=platform
server.port=8080

# ---------- File upload limits ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---------- DataSource ----------
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate 7 automatically detects the MySQL dialect; explicit dialect setting removed.

# ---------- Mail (optional) ----------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# ---------- File storage ----------
app.upload.dir=uploads/profile-pictures

# ---------- Default System Administrator ----------
app.admin.username=admin
app.admin.password=Admin@12345
app.admin.email=admin@finc.local